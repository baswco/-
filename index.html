<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2026 사대회 현장 접수 스캐너</title>
  <style>
    :root {
      --navy: #0f2f5c; --accent: #1f7ae0;
      --ok: #0f9d58; --ok-bg: #0d281e; --ok-border: #2bb471;
      --warn: #f29900; --warn-bg: #291e0a;
      --err: #d93025; --err-bg: #291012;
      --bg: #0d1420; --card: #151d2b; --line: #2b3646; --sub: #8b97a8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background: var(--bg); color: #fff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14.5px; line-height: 1.4;
      -webkit-text-size-adjust: 100%;
    }
    .wrap {
      max-width: 480px; margin: 0 auto; min-height: 100vh;
      display: flex; flex-direction: column; padding-bottom: 20px;
    }

    /* 상단 헤더 */
    .top {
      padding: 12px 16px; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--line); background: #0b111b; position: sticky; top: 0; z-index: 100;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #4b5666; }
    .dot.on { background: #3ddc84; box-shadow: 0 0 0 4px rgba(61, 220, 132, 0.25); }
    .dot.paused { background: #f29900; box-shadow: 0 0 0 4px rgba(242, 153, 0, 0.25); }
    .top .t { font-weight: 800; font-size: 15px; }
    .top .c { margin-left: auto; font-size: 13.5px; font-weight: 800; color: #3ddc84; }

    .main-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; }

    /* 📸 큼직해진 카메라 화면 (화면의 중심) */
    .camwrap {
      position: relative; background: #000; border-radius: 14px;
      width: 100%; height: 320px; max-height: 48vh; overflow: hidden; border: 1.5px solid var(--line);
    }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    canvas { display: none; }
    .frame {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
    }
    .frame i {
      width: 65%; aspect-ratio: 1/1; border: 3px solid rgba(255, 255, 255, 0.9); border-radius: 18px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.4);
    }
    .camhint {
      position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
      font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000;
    }
    .cam-overlay {
      position: absolute; inset: 0; background: rgba(13, 20, 32, 0.88);
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px;
      color: #3ddc84; z-index: 5;
    }

    /* 🌟 슬림 & 콤팩트해진 결과 표시창 */
    .result {
      position: relative;
      padding: 12px 14px; text-align: center; min-height: 80px; display: flex;
      flex-direction: column; justify-content: center; background: var(--card);
      border: 1.5px solid var(--line); border-radius: 12px;
      transition: all 0.25s ease-out; overflow: hidden;
    }
    .result.pop { animation: pop 0.3s ease-out; }
    @keyframes pop {
      0% { transform: scale(0.97); }
      50% { transform: scale(1.01); }
      100% { transform: scale(1); }
    }

    .result .idle-row { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--sub); font-weight: 700; }
    .result .idle-row .ic { font-size: 22px; }
    .result .idle-row .msg { font-size: 15px; color: #b0bccd; }

    .result .msg { font-size: 19px; font-weight: 900; letter-spacing: -0.3px; }
    .result .nm { font-size: 18px; font-weight: 900; margin-top: 4px; color: #fff; }
    .result .sub { font-size: 13px; color: var(--sub); margin-top: 2px; }

    /* 성공(완료) 스타일 */
    .result.ok { border-color: var(--ok-border); background: var(--ok-bg); }
    .result.ok .msg { color: #3ddc84; }
    .result.warn { border-color: var(--warn); background: var(--warn-bg); }
    .result.warn .msg { color: #ffc94d; }
    .result.err { border-color: var(--err); background: var(--err-bg); }
    .result.err .msg { color: #ff6b5e; }

    /* 좌석 / 응모권 뱃지 (슬림 디자인) */
    .chips {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.15);
    }
    .badge-box {
      background: rgba(255,255,255,0.06); border-radius: 8px; padding: 6px; text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .badge-box.seat { border-color: rgba(77, 163, 255, 0.4); background: rgba(31, 122, 224, 0.15); }
    .badge-box.ticket { border-color: rgba(61, 220, 132, 0.4); background: rgba(15, 157, 88, 0.15); }
    .badge-label { font-size: 11px; color: #9aa7b8; font-weight: 600; }
    .badge-value { font-size: 18px; font-weight: 900; line-height: 1.15; margin-top: 1px; }
    .badge-box.seat .badge-value { color: #5eb2ff; }
    .badge-box.ticket .badge-value { color: #43e68c; }

    .time-stamp { font-size: 11.5px; color: #8b97a8; margin-top: 4px; }

    .timer-bar {
      position: absolute; bottom: 0; left: 0; height: 3.5px; background: #3ddc84;
      width: 100%; transform-origin: left;
    }
    .timer-bar.running { animation: timer 6s linear forwards; }
    @keyframes timer { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    .btn-next {
      background: #1f7ae0; color: #fff; border: 0;
      border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 800; margin-top: 8px; cursor: pointer;
    }

    /* 수동 입력 및 하단 조작부 */
    .control-box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .row { display: flex; gap: 6px; }
    input[type=text] {
      flex: 1; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: #0b111b; color: #fff; font-size: 14px; outline: none; font-family: inherit;
    }
    input[type=text]:focus { border-color: var(--accent); }
    
    button {
      border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-submit { background: var(--accent); color: #fff; padding: 11px 16px; font-size: 14px; }
    
    .btn-camera {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 12px; margin-top: 8px; background: var(--ok); color: #fff;
      border-radius: 8px; font-size: 15px; font-weight: 800;
    }
    .btn-restart {
      background: #1a2434; color: var(--sub); border: 1px solid var(--line);
      padding: 8px; width: 100%; margin-top: 8px; font-size: 12px;
    }
    .note { font-size: 11.5px; color: #7c899b; margin-top: 8px; line-height: 1.4; text-align: center; }
    .hide { display: none !important; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="top">
      <span class="dot" id="dot"></span>
      <span class="t">2026 사대회 현장 접수</span>
      <span class="c" id="cnt">접수 0명</span>
    </div>

    <div class="main-body">
      <!-- 📸 대형 카메라 뷰파인더 -->
      <div class="camwrap" id="camwrap">
        <video id="v" autoplay playsinline muted webkit-playsinline></video>
        <canvas id="cv"></canvas>
        <div class="frame"><i></i></div>
        <div class="camhint">QR 코드를 비추면 즉시 자동 처리됩니다</div>
        <div class="cam-overlay hide" id="camOverlay">✅ 출석 확인 완료 (대기 중)</div>
      </div>

      <!-- 🌟 슬림 결과창 -->
      <div class="result" id="res">
        <div class="idle-row">
          <span class="ic">📷</span>
          <span class="msg">스캔 대기 중 (QR을 비춰주세요)</span>
        </div>
        <div class="timer-bar hide" id="timerBar"></div>
      </div>

      <!-- 수동 번호 입력 및 버튼 영역 -->
      <div class="control-box">
        <div class="row">
          <input type="text" id="manual" placeholder="접수번호(R00002), 이름 입력" autocomplete="off">
          <button class="btn-submit" onclick="manualCheck()">확인</button>
        </div>

        <input type="file" id="fileCam" accept="image/*" capture="environment" class="hide" onchange="onScanFile(this)">
        <button class="btn-camera" onclick="document.getElementById('fileCam').click()">
          📸 카메라로 QR 바로 찍기
        </button>

        <button class="btn-restart" onclick="restartCamera()">🔄 실시간 카메라 다시 켜기</button>

        <div class="note">
          · 접수번호(<b>R00002</b>), <b>이름</b>, <b>연락처</b>로도 검색 및 출석이 가능합니다.
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbztTWFK3i3F3sjXkeZujNA53ZSnZet_QKWyGIi9cwhVcrFrgPW1gu4FsklnXtqceQdl/exec';
    var STAFF_KEY   = 'swc2026';

    var count = 0, isProcessing = false, isPaused = false, lockTimer = null, lastScannedValue = '';
    var v  = document.getElementById('v');
    var cv = document.getElementById('cv');
    var ctx= cv.getContext('2d', { willReadFrequently: true });

    function startCamera(){
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      }).then(handleStreamSuccess)
      .catch(function(){
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then(handleStreamSuccess)
          .catch(function(err){ document.getElementById('dot').classList.remove('on'); });
      });
    }

    function handleStreamSuccess(s){
      v.srcObject = s;
      v.setAttribute('playsinline', '');
      v.play().then(function(){
        document.getElementById('dot').className = 'dot on';
        loop();
      }).catch(function(){});
    }

    function restartCamera(){ unlockScan(); startCamera(); }

    function loop(){
      requestAnimationFrame(loop);
      if (isPaused || isProcessing || v.readyState !== v.HAVE_ENOUGH_DATA) return;
      var w = v.videoWidth, h = v.videoHeight;
      if (!w || !h) return;
      var size = Math.min(w, h);
