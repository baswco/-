<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2026 사대회 현장 접수 자동 스캐너</title>
  <style>
    :root {
      --navy: #0f2f5c;
      --navy2: #1a4b8c;
      --accent: #1f7ae0;
      --ok: #0f9d58;
      --warn: #f29900;
      --err: #d93025;
      --bg: #0d1420;
      --card: #151d2b;
      --line: #2b3646;
      --sub: #8b97a8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* 상단 상태 바 */
    .top {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      background: #0b111b;
      z-index: 10;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4b5666;
      flex: none;
    }
    .dot.on {
      background: #3ddc84;
      box-shadow: 0 0 0 4px rgba(61, 220, 132, 0.25);
    }
    .top .t { font-weight: 800; font-size: 16px; letter-spacing: -0.3px; }
    .top .c { margin-left: auto; font-size: 14px; font-weight: 700; color: #3ddc84; }

    /* 실시간 카메라 뷰파인더 */
    .camwrap {
      position: relative;
      background: #000;
      flex: 1;
      min-height: 240px;
      overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    canvas { display: none; }
    .frame {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .frame i {
      width: 68%;
      aspect-ratio: 1 / 1;
      border: 3px solid rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.45);
    }
    .camhint {
      position: absolute;
      left: 0; right: 0; bottom: 14px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 4px #000;
    }

    /* 접수 결과 표시창 */
    .result {
      padding: 18px 16px;
      text-align: center;
      min-height: 175px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--card);
      border-top: 1px solid var(--line);
    }
    .result .ic { font-size: 42px; line-height: 1; margin-bottom: 4px; }
    .result .msg { font-size: 22px; font-weight: 800; }
    .result .nm { font-size: 19px; font-weight: 800; margin-top: 6px; color: #fff; }
    .result .sub { font-size: 14px; color: var(--sub); margin-top: 2px; }
    
    .result.ok   .msg { color: #3ddc84; }
    .result.warn .msg { color: #ffc94d; }
    .result.err  .msg { color: #ff6b5e; }

    .chips {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .chip {
      background: #1a2434;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13.5px;
      color: #c9d4e2;
    }
    .chip.seat b { color: #4da3ff; font-size: 16px; }
    .chip.ticket b { color: #3ddc84; font-size: 16px; }

    /* 하단 조작 바 */
    .bar {
      padding: 12px 16px 24px;
      background: #0b111b;
      border-top: 1px solid var(--line);
    }
    .row { display: flex; gap: 8px; }
    input[type=text] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #151d2b;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }
    input[type=text]:focus { border-color: var(--accent); }
    input[type=text]::placeholder { color: #5d6a7d; }

    button {
      border: 0;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }
    .btn-submit {
      background: var(--accent);
      color: #fff;
      padding: 12px 18px;
    }

    .hide { display: none !important; }
  </style>
</head>
<body>

  <!-- 상단 상태 바 -->
  <div class="top">
    <span class="dot" id="dot"></span>
    <span class="t">2026 사대회 자동 스캐너</span>
    <span class="c" id="cnt">확인 0명</span>
  </div>

  <!-- 실시간 카메라 뷰파인더 -->
  <div class="camwrap">
    <video id="v" autoplay playsinline muted webkit-playsinline></video>
    <canvas id="cv"></canvas>
    <div class="frame"><i></i></div>
    <div class="camhint">참가자의 QR 코드를 비춰주세요 (자동 인식)</div>
  </div>

  <!-- 접수 결과 카드 -->
  <div class="result" id="res">
    <div class="ic">📷</div>
    <div class="msg
