<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1420">
<title>사대회 현장 접수</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f2f5c'/%3E%3Ctext x='90' y='120' font-size='96' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%9C%93%3C/text%3E%3C/svg%3E">

<script>
/* ══════════════════════════════════════════════════════════════
 *  설정 — 이미 채워져 있습니다. 값이 바뀌면 여기만 고치세요.
 * ══════════════════════════════════════════════════════════════ */
var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbztTWFK3i3F3sjXkeZujNA53ZSnZet_QKWyGIi9cwhVcrFrgPW1gu4FsklnXtqceQdl/exec';
var STAFF_KEY  = 'swc2026';

var HOLD_MS = 5000;   // 접수 결과를 화면에 유지하는 시간 (5초)
</script>

<style>
  :root{--line:#2b3646;--ok:#0f9d58;--warn:#e8a33d;--err:#d93025;--accent:#1f7ae0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#0d1420;color:#fff;
       font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;
       -webkit-text-size-adjust:100%;overscroll-behavior:none;
       padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

  .top{padding:11px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .top .dot{width:9px;height:9px;border-radius:50%;background:#4b5666;flex:none;transition:.2s}
  .top .dot.on{background:#3ddc84;box-shadow:0 0 0 4px rgba(61,220,132,.2)}
  .top .t{font-weight:800;font-size:15px}
  .top .c{margin-left:auto;font-size:12.5px;color:#8b97a8}

  /* 카메라 */
  .camwrap{position:relative;background:#000;flex:1;min-height:38vh;overflow:hidden}
  video{width:100%;height:100%;object-fit:cover;display:block}
  canvas{display:none}
  .frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .frame i{width:66%;aspect-ratio:1/1;border:3px solid rgba(255,255,255,.9);border-radius:22px;
           box-shadow:0 0 0 2000px rgba(0,0,0,.32)}
  .camhint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:13px;
           color:rgba(255,255,255,.9);text-shadow:0 1px 4px #000;pointer-events:none}
  .camerr{padding:24px 20px;text-align:center;color:#ffc94d;font-size:14px;line-height:1.7;flex:1}
  .camerr b{color:#fff}

  /* 결과 띠 — 접수대에서 멀리서도 보이게 */
  .res{padding:20px 16px 16px;text-align:center;transition:background .18s;
       background:#111a26;position:relative;overflow:hidden}
  .res.ok   {background:var(--ok)}
  .res.warn {background:var(--warn)}
  .res.err  {background:var(--err)}
  .res .ic{font-size:34px;line-height:1}
  .res .msg{font-size:28px;font-weight:800;margin-top:2px;line-height:1.25;white-space:pre-line}
  .res .nm{font-size:22px;font-weight:800;margin-top:10px}
  .res .sub{font-size:14.5px;opacity:.92;margin-top:3px;white-space:pre-line;line-height:1.5}
  .res.idle .msg{font-size:19px;font-weight:600;color:#8b97a8}
  .res.idle .ic{font-size:26px;opacity:.5}

  .chips{display:flex;gap:9px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.2);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600}
  .chip b{font-size:22px;font-weight:800}

  /* 동명이인 고르기 */
  .res.pick{background:#16233a;text-align:left;padding:16px 14px 14px}
  .pickhead{text-align:center;margin-bottom:12px}
  .pickhead .t{font-size:21px;font-weight:800;color:#ffc94d}
  .pickhead .s{font-size:13.5px;color:#9aa7b8;margin-top:4px}
  .cands{display:grid;gap:8px;max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .cand{display:block;width:100%;text-align:left;background:#1e2c44;border:1px solid #33455f;
        border-radius:12px;padding:13px 15px;color:#fff;font-family:inherit;cursor:pointer}
  .cand:active{background:#27395a}
  .cand .l1{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
  .cand .l1 em{font-style:normal;font-size:12px;font-weight:700;background:#0f9d58;
               border-radius:5px;padding:2px 7px}
  .cand .l1 em.done{background:#e8a33d;color:#3a2a00}
  .cand .l2{font-size:13.5px;color:#a9b7c9;margin-top:5px;line-height:1.5}
  .cand .l2 b{color:#fff;font-weight:700}
  .cancel{width:100%;margin-top:10px;background:#26344a;color:#c9d4e2;padding:12px;font-size:14px}

  /* 5초 카운트 막대 */
  .hold{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.55);width:0}
  .hold.run{animation:shrink var(--hold,5s) linear forwards}
  @keyframes shrink{from{width:100%}to{width:0}}

  .bar{padding:12px 16px 20px;border-top:1px solid var(--line);background:#0b111b}
  .row{display:flex;gap:8px}
  input[type=text]{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);
                   background:#151d2b;color:#fff;font-size:15px;font-family:inherit;outline:none}
  input::placeholder{color:#5d6a7d}
  button{border:0;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer;font-size:15px}
  .b1{background:var(--accent);color:#fff;padding:13px 18px}
  .links{display:flex;justify-content:center;gap:18px;margin-top:10px}
  .links button{background:none;color:#6b7a8d;font-size:12.5px;text-decoration:underline;
                padding:6px 2px;font-weight:500}
  .bshoot{background:linear-gradient(160deg,#1f7ae0,#1559ab);color:#fff;padding:17px;
          width:100%;margin-top:10px;font-size:17px;border:0}
  .note{font-size:12px;color:#7c899b;margin-top:9px;line-height:1.55;text-align:center}
  .hide{display:none !important}

  .setup{padding:40px 22px;text-align:center}
  .setup h2{font-size:20px;margin:0 0 8px}
  .setup p{font-size:14px;color:#9aa7b8;line-height:1.65;margin:0 0 20px}
  .setup input{width:100%;margin-bottom:10px;text-align:center}
  .setup .b1{width:100%;padding:15px}
  .setup .err{color:#ff6b5e;font-size:13.5px;margin-top:12px;font-weight:700}
</style>
</head>
<body>

<div class="wrap">

  <!-- 주소·접속키가 비어 있을 때만 나오는 예비 화면 -->
  <div class="setup hide" id="setup">
    <div style="font-size:44px">★</div>
    <h2>현장 접수 스캐너</h2>
    <p>담당자에게 받은 두 값을 넣어주세요.</p>
    <input type="text" id="s_url" placeholder="웹앱 주소 (…/exec)" autocomplete="off" autocapitalize="off" spellcheck="false">
    <input type="text" id="s_key" placeholder="직원 접속키" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="b1" onclick="saveSetup()">저장하고 시작</button>
    <div class="err hide" id="s_err"></div>
  </div>

  <!-- 스캐너 -->
  <div id="main" class="hide" style="flex-direction:column;flex:1">

    <div class="top">
      <span class="dot" id="dot"></span>
      <span class="t">현장 접수 스캐너</span>
      <span class="c" id="cnt">확인 0명</span>
    </div>

    <div class="camwrap" id="camwrap">
      <video id="v" playsinline muted autoplay></video>
      <canvas id="cv"></canvas>
      <div class="frame"><i></i></div>
      <div class="camhint">QR을 네모 안에 갖다 대세요</div>
    </div>
    <div class="camerr hide" id="camerr"></div>

    <div class="res idle" id="res">
      <div class="ic">▣</div>
      <div class="msg">카메라를 켜는 중...</div>
      <div class="hold" id="hold"></div>
    </div>

    <div class="bar">
      <div class="row">
        <input type="text" id="manual" placeholder="접수번호(R00002) · 연락처 · 이름" autocomplete="off">
        <button class="b1" onclick="manualCheck()">확인</button>
      </div>

      <!-- 카메라가 막힌 기기에서만 크게 나옵니다 -->
      <button class="bshoot hide" id="shootBtn" onclick="document.getElementById('fileCam').click()">
        ▣ 사진 찍어서 접수
      </button>
      <input type="file" id="fileCam" accept="image/*" capture="environment" class="hide" onchange="onScanFile(this)">

      <div class="links">
        <button onclick="restartLive()">카메라 다시 시작</button>
        <button onclick="document.getElementById('fileCam').click()">사진으로 찍기</button>
      </div>

      <div class="note">
        이름은 동명이인이 많습니다. <b>접수번호나 연락처</b>가 가장 정확합니다.<br>
        명단에 없으면 <b>노트북 담당 직원</b>에게 안내하세요.
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
/* ═════════ 설정 읽기 ═════════ */
var CFG = { url: '', key: '' };

function loadCfg(){
  CFG.url = WEBAPP_URL || '';
  CFG.key = STAFF_KEY  || '';
  if (!CFG.url || !CFG.key){
    try {
      CFG.url = CFG.url || localStorage.getItem('swc_url') || '';
      CFG.key = CFG.key || localStorage.getItem('swc_key') || '';
    } catch(e){}
  }
  var q = new URLSearchParams(location.search);
  if (q.get('u')) CFG.url = q.get('u');
  if (q.get('k')) CFG.key = q.get('k');
  CFG.url = (CFG.url || '').split('?')[0].trim();
  CFG.key = (CFG.key || '').trim();
  return CFG.url && CFG.key;
}

function saveSetup(){
  var u = document.getElementById('s_url').value.trim();
  var k = document.getElementById('s_key').value.trim();
  var e = document.getElementById('s_err');
  if (u.indexOf('/exec') < 0){
    e.textContent = '웹앱 주소는 /exec 로 끝나야 합니다.'; e.classList.remove('hide'); return;
  }
  if (!k){ e.textContent = '접속키를 넣어주세요.'; e.classList.remove('hide'); return; }
  CFG.url = u.split('?')[0]; CFG.key = k;
  try { localStorage.setItem('swc_url', CFG.url); localStorage.setItem('swc_key', k); } catch(err){}
  document.getElementById('setup').classList.add('hide');
  boot();
}

/* ═════════ 서버 호출 (JSONP) ═════════ */
var jsonpSeq = 0;
function callApi(params, onDone, onFail){
  var name = '__swc_cb_' + (++jsonpSeq);
  var done = false;
  var s = document.createElement('script');

  window[name] = function(data){
    done = true;
    try { onDone && onDone(data); } finally {
      try { delete window[name]; } catch(e){ window[name] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    }
  };

  var q = ['cb=' + name, 'k=' + encodeURIComponent(CFG.key), '_=' + Date.now()];
  Object.keys(params).forEach(function(p){ q.push(p + '=' + encodeURIComponent(params[p])); });

  s.src = CFG.url + '?p=api&' + q.join('&');
  s.onerror = function(){ if (!done){ done = true; onFail && onFail('연결 실패'); } };
  setTimeout(function(){ if (!done){ done = true; onFail && onFail('응답 시간 초과'); } }, 15000);
  document.body.appendChild(s);
}

/* ═════════ 접수 처리 ═════════ */
var count = 0, busy = false, lastCode = '', lastAt = 0, holdTimer = null;

function handle(raw){
  var now = Date.now();
  if (raw === lastCode && now - lastAt < HOLD_MS) return;   // 같은 QR 연속 인식 방지
  lastCode = raw; lastAt = now;
  busy = true;
  clearHold();
  beep(880, .06);
  show('', '⏳', '확인 중...', null, null, null);

  callApi({ a:'checkin', t: raw }, function(r){
    render(r);
    busy = false;
    if (r && r.ok && r.needTalk){
      var tk = (r.person && r.person.토큰) ? r.person.토큰 : raw;
      callApi({ a:'talk', t: tk }, function(){}, function(){});
    }
  }, function(msg){
    show('err','⚠','통신 오류', null, null, msg + '\n인터넷을 확인하고 다시 찍어주세요.');
    startHold();
    busy = false;
  });
}

function manualCheck(){
  var el = document.getElementById('manual');
  var t = el.value.trim();
  if (!t) return;
  el.value = ''; el.blur(); lastCode = '';
  handle(t);
}

function render(r){
  if (r.ok){
    count++;
    document.getElementById('cnt').textContent = '확인 ' + count + '명';
    beep(1320,.11); setTimeout(function(){ beep(1760,.14); }, 120);
    vibe([40,60,40]);
    show('ok','✓','참석이 완료되었습니다', r.person, chips(r.person), null);

  } else if (r.code === 'ALREADY'){
    beep(440,.3); vibe([120,80,120]);
    show('warn','⚠','이미 참석확인된 QR입니다', r.person, chips(r.person),
         '앞서 접수된 분입니다. 본인이 맞는지 확인해 주세요.');

  } else if (r.code === 'MULTI'){
    beep(660,.12); vibe([60]);
    showPick(r.list);
    return;                       // 직원이 고를 때까지 화면을 유지합니다

  } else if (r.code === 'NOT_FOUND'){
    beep(220,.45); vibe([200,100,200]);
    show('err','✕','확인 불가', null, null,
         '명단에 없습니다.\n노트북 담당 직원에게 안내해 주세요.');

  } else if (r.code === 'AUTH'){
    show('err','⚠','접속키 오류', null, null, '담당자에게 문의하세요.');

  } else {
    beep(220,.3);
    show('err','✕', r.msg || '확인 불가', null, null, '노트북 담당 직원에게 안내해 주세요.');
  }
  startHold();
}

function chips(p){
  if (!p) return '';
  var seat = p.좌석배치
    ? '<span class="chip">좌석 <b>' + esc(p.좌석배치) + '</b></span>'
    : '';
  return '<div class="chips">' + seat +
    '<span class="chip">응모권 <b>' + esc(p.응모권 || '-') + '</b></span>' +
    '<span class="chip">' + esc(p.소속지회 || '') + '</span></div>';
}

function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function show(cls, ic, msg, person, chipHtml, sub){
  var el = document.getElementById('res');
  el.className = 'res ' + (cls || 'idle');
  var h = '<div class="ic">' + ic + '</div><div class="msg">' + esc(msg) + '</div>';
  if (person) h += '<div class="nm">' + esc(person.이름) + ' 선생님</div>' +
                   '<div class="sub">' + esc(person.기관명||'') + '</div>';
  if (sub)      h += '<div class="sub" style="margin-top:8px">' + esc(sub) + '</div>';
  if (chipHtml) h += chipHtml;
  h += '<div class="hold" id="hold"></div>';
  el.innerHTML = h;
}

/* 동명이인 — 직원이 직접 고르는 화면 (자동으로 사라지지 않습니다) */
function showPick(list){
  clearHold();
  busy = true;                       // 고르는 동안 카메라 인식 잠시 멈춤

  var h = '<div class="pickhead">' +
          '<div class="t">누구신가요?</div>' +
          '<div class="s">같은 조건에 ' + list.length + '명이 있습니다. 본인에게 확인하고 골라주세요.</div>' +
          '</div><div class="cands">';

  list.forEach(function(p, i){
    var done = String(p.참석확인 || '').toUpperCase() === 'O';
    h += '<button class="cand" onclick="pickOne(' + i + ')">' +
           '<div class="l1">' + esc(p.이름) +
             (done ? '<em class="done">접수완료</em>' : '<em>대기</em>') +
           '</div>' +
           '<div class="l2">' +
             '생년월일 <b>' + esc(p.생년월일 || '-') + '</b> · ' +
             '연락처 뒷자리 <b>' + esc(p.연락처뒤 || '-') + '</b><br>' +
             esc(p.기관명 || '-') + ' · ' + esc(p.소속지회 || '') + ' · ' +
             '접수번호 <b>' + esc(p.접수번호 || '-') + '</b>' +
           '</div>' +
         '</button>';
  });

  h += '</div><button class="cancel" onclick="cancelPick()">취소</button>';

  var el = document.getElementById('res');
  el.className = 'res pick';
  el.innerHTML = h;

  window.__cands = list;
}

function pickOne(i){
  var p = (window.__cands || [])[i];
  if (!p || !p.토큰) return;
  busy = false;
  lastCode = '';
  handle(p.토큰);
}

function cancelPick(){
  window.__cands = null;
  busy = false;
  lastCode = '';
  idle();
}

/* 결과를 5초 보여준 뒤 대기 화면으로 돌아갑니다 */
function startHold(){
  clearHold();
  var bar = document.getElementById('hold');
  if (bar){
    bar.style.setProperty('--hold', (HOLD_MS/1000) + 's');
    bar.classList.add('run');
  }
  holdTimer = setTimeout(idle, HOLD_MS);
}
function clearHold(){
  if (holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
}
function idle(){
  clearHold();
  show('', '▣', live ? '대기 중 — QR을 갖다 대세요' : '사진으로 접수하세요', null, null, null);
}

/* ═════════ 사진 촬영 판독 (카메라가 막힌 기기용) ═════════ */
function onScanFile(input){
  var file = input.files[0];
  if (!file) return;
  busy = true; clearHold();
  show('', '⏳', '사진 분석 중...', null, null, null);

  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement('canvas');
      var c = canvas.getContext('2d');
      var maxDim = 1200, w = img.width, h = img.height;
      if (w > maxDim || h > maxDim){
        if (w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else      { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      canvas.width = w; canvas.height = h;
      c.drawImage(img, 0, 0, w, h);
      var d = c.getImageData(0, 0, w, h);

      var code = (typeof jsQR === 'function')
        ? jsQR(d.data, d.width, d.height, { inversionAttempts:'dontInvert' }) : null;
      if (!code || !code.data){
        code = (typeof jsQR === 'function')
          ? jsQR(d.data, d.width, d.height, { inversionAttempts:'attemptBoth' }) : null;
      }
      busy = false;

      if (code && code.data){ lastCode = ''; handle(code.data); }
      else {
        beep(220,.3);
        show('err','✕','QR 인식 실패', null, null,
             '조금 더 가까이서 다시 찍어주세요.\n참가자 화면 밝기를 최대로 올려주세요.');
        startHold();
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

/* ═════════ 실시간 카메라 (열자마자 자동 시작) ═════════ */
var stream = null, raf = null, live = false, v, cv, ctx;

function startLive(){
  v   = document.getElementById('v');
  cv  = document.getElementById('cv');
  ctx = cv.getContext('2d', { willReadFrequently: true });

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return camFail('이 브라우저는 카메라를 지원하지 않습니다');
  }
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal:'environment' }, width:{ideal:1280}, height:{ideal:1280} },
    audio: false
  }).then(function(s){
    stream = s; v.srcObject = s; v.setAttribute('playsinline','');
    return v.play();
  }).then(function(){
    live = true;
    document.getElementById('dot').classList.add('on');
    document.getElementById('camwrap').classList.remove('hide');
    document.getElementById('camerr').classList.add('hide');
    document.getElementById('shootBtn').classList.add('hide');
    idle();
    loop();
  }).catch(function(e){ camFail(e && e.name ? e.name : String(e)); });
}

function restartLive(){
  if (raf) cancelAnimationFrame(raf);
  if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
  stream = null; live = false;
  document.getElementById('dot').classList.remove('on');
  setTimeout(startLive, 300);
}

function camFail(reason){
  live = false;
  document.getElementById('dot').classList.remove('on');
  document.getElementById('camwrap').classList.add('hide');
  document.getElementById('shootBtn').classList.remove('hide');

  var el = document.getElementById('camerr');
  el.classList.remove('hide');
  el.innerHTML = '⚠ 카메라를 열 수 없습니다 (' + esc(reason) + ')<br>' +
    '카카오톡 안에서 열면 막힙니다. <b>사파리·크롬</b>으로 열어주세요.<br><br>' +
    '<b>아래 [사진 찍어서 접수] 로는 그대로 접수됩니다.</b>';
  idle();
}

function loop(){
  if (!live) return;
  raf = requestAnimationFrame(loop);
  if (busy || v.readyState !== v.HAVE_ENOUGH_DATA) return;
  var w = v.videoWidth, h = v.videoHeight;
  if (!w || !h) return;
  var size = Math.min(w, h);
  cv.width = 500; cv.height = 500;
  ctx.drawImage(v, (w-size)/2, (h-size)/2, size, size, 0, 0, 500, 500);
  var d = ctx.getImageData(0, 0, 500, 500);
  var code = (typeof jsQR === 'function')
    ? jsQR(d.data, d.width, d.height, { inversionAttempts:'dontInvert' }) : null;
  if (code && code.data) handle(code.data);
}

/* ═════════ 소리 · 진동 ═════════ */
var actx = null;
function beep(freq, dur){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(.001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.3, actx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + .02);
  }catch(e){}
}
function vibe(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

document.addEventListener('click', function once(){
  try{ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){}
  document.removeEventListener('click', once);
});

/* 화면이 꺼졌다 돌아오면 카메라를 되살립니다 */
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && !live && CFG.url) restartLive();
});

/* ═════════ 시작 ═════════ */
function boot(){
  var m = document.getElementById('main');
  m.classList.remove('hide');
  m.style.display = 'flex';
  document.getElementById('manual')
    .addEventListener('keydown', function(e){ if (e.key === 'Enter') manualCheck(); });
  startLive();
}

if (loadCfg()) boot();
else document.getElementById('setup').classList.remove('hide');
</script>
