<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2026 사대회 현장 접수 스캐너</title>
  <style>
    :root {
      --navy: #0f2f5c; --accent: #1f7ae0;
      --ok: #0f9d58; --ok-bg: #0d281e; --ok-border: #2bb471;
      --warn: #f29900; --warn-bg: #291e0a;
      --err: #d93025; --err-bg: #291012;
      --bg: #0d1420; --card: #151d2b; --line: #2b3646; --sub: #8b97a8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background: var(--bg); color: #fff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14.5px; line-height: 1.4;
      -webkit-text-size-adjust: 100%;
    }
    .wrap {
      max-width: 480px; margin: 0 auto; min-height: 100vh;
      display: flex; flex-direction: column; padding-bottom: 20px;
    }

    /* 상단 헤더 */
    .top {
      padding: 12px 16px; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--line); background: #0b111b; position: sticky; top: 0; z-index: 100;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #4b5666; }
    .dot.on { background: #3ddc84; box-shadow: 0 0 0 4px rgba(61, 220, 132, 0.25); }
    .dot.paused { background: #f29900; box-shadow: 0 0 0 4px rgba(242, 153, 0, 0.25); }
    .top .t { font-weight: 800; font-size: 15px; }
    .top .c { margin-left: auto; font-size: 13.5px; font-weight: 800; color: #3ddc84; }

    .main-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; }

    /* 📸 대형 카메라 뷰파인더 */
    .camwrap {
      position: relative; background: #151d2b; border-radius: 14px;
      width: 100%; height: 320px; max-height: 48vh; overflow: hidden; border: 1.5px solid var(--line);
      display: flex; align-items: center; justify-content: center;
    }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    canvas { display: none; }
    
    .frame {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
    }
    .frame i {
      width: 65%; aspect-ratio: 1/1; border: 3px solid rgba(255, 255, 255, 0.9); border-radius: 18px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.4);
    }
    .camhint {
      position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
      font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000;
    }

    /* 🌟 카메라 상태 및 터치 시작 안내창 */
    .cam-status {
      position: absolute; inset: 0; background: #151d2b;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center; z-index: 10; gap: 10px;
    }
    .cam-status .icon { font-size: 38px; }
    .cam-status .text { font-size: 15px; font-weight: 700; color: #c9d4e2; }

    .cam-overlay {
      position: absolute; inset: 0; background: rgba(13, 20, 32, 0.88);
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px;
      color: #3ddc84; z-index: 5;
    }

    /* 🌟 슬림 결과 표시창 */
    .result {
      position: relative;
      padding: 12px 14px; text-align: center; min-height: 80px; display: flex;
      flex-direction: column; justify-content: center; background: var(--card);
      border: 1.5px solid var(--line); border-radius: 12px;
      transition: all 0.25s ease-out; overflow: hidden;
    }
    .result.pop { animation: pop 0.3s ease-out; }
    @keyframes pop {
      0% { transform: scale(0.97); }
      50% { transform: scale(1.01); }
      100% { transform: scale(1); }
    }

    .result .idle-row { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--sub); font-weight: 700; }
    .result .idle-row .ic { font-size: 22px; }
    .result .idle-row .msg { font-size: 15px; color: #b0bccd; }

    .result .msg { font-size: 19px; font-weight: 900; letter-spacing: -0.3px; }
    .result .nm { font-size: 18px; font-weight: 900; margin-top: 4px; color: #fff; }
    .result .sub { font-size: 13px; color: var(--sub); margin-top: 2px; }

    .result.ok { border-color: var(--ok-border); background: var(--ok-bg); }
    .result.ok .msg { color: #3ddc84; }
    .result.warn { border-color: var(--warn); background: var(--warn-bg); }
    .result.warn .msg { color: #ffc94d; }
    .result.err { border-color: var(--err); background: var(--err-bg); }
    .result.err .msg { color: #ff6b5e; }

    .chips {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.15);
    }
    .badge-box {
      background: rgba(255,255,255,0.06); border-radius: 8px; padding: 6px; text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .badge-box.seat { border-color: rgba(77, 163, 255, 0.4); background: rgba(31, 122, 224, 0.15); }
    .badge-box.ticket { border-color: rgba(61, 220, 132, 0.4); background: rgba(15, 157, 88, 0.15); }
    .badge-label { font-size: 11px; color: #9aa7b8; font-weight: 600; }
    .badge-value { font-size: 18px; font-weight: 900; line-height: 1.15; margin-top: 1px; }
    .badge-box.seat .badge-value { color: #5eb2ff; }
    .badge-box.ticket .badge-value { color: #43e68c; }

    .time-stamp { font-size: 11.5px; color: #8b97a8; margin-top: 4px; }

    .timer-bar {
      position: absolute; bottom: 0; left: 0; height: 3.5px; background: #3ddc84;
      width: 100%; transform-origin: left;
    }
    .timer-bar.running { animation: timer 6s linear forwards; }
    @keyframes timer { from { transform: scaleX(1); } to { transform: scaleX(0); } }

      background: #1f7ae0; color: #fff; border: 0;
      border-radius: 8px; padding
