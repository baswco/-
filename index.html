<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1420">
<title>사대회 현장 접수</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f2f5c'/%3E%3Ctext x='90' y='120' font-size='96' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%9C%93%3C/text%3E%3C/svg%3E">

<script>
/* ══════════════════════════════════════════════════════════════
 *  ★★★ 여기 두 줄만 채우면 됩니다 ★★★
 *
 *  1) WEBAPP_URL — 스프레드시트 [사대회 시스템] → 현장 접수 스캐너 주소
 *                  에서 나오는 주소 중 물음표(?) 앞부분까지만
 *                  예) https://script.google.com/macros/s/AKfycb.../exec
 *
 *  2) STAFF_KEY  — 00_설정.gs 의 STAFF_KEY 값과 똑같이
 *
 *  채워 넣으면 직원들은 아무것도 입력할 필요 없이
 *  주소만 열면 바로 카메라가 켜집니다.
 * ══════════════════════════════════════════════════════════════ */
var WEBAPP_URL = '';
var STAFF_KEY  = '';
</script>

<style>
  :root{--line:#2b3646;--ok:#3ddc84;--warn:#ffc94d;--err:#ff6b5e;--accent:#1f7ae0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#0d1420;color:#fff;
       font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;
       -webkit-text-size-adjust:100%;overscroll-behavior:none;
       padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

  .top{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .top .dot{width:9px;height:9px;border-radius:50%;background:#4b5666;flex:none;transition:.2s}
  .top .dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(61,220,132,.2)}
  .top .t{font-weight:800;font-size:15px}
  .top .c{margin-left:auto;font-size:12.5px;color:#8b97a8}

  .camwrap{position:relative;background:#000;aspect-ratio:1/1;overflow:hidden}
  video{width:100%;height:100%;object-fit:cover;display:block}
  canvas{display:none}
  .frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .frame i{width:62%;aspect-ratio:1/1;border:3px solid rgba(255,255,255,.85);border-radius:20px;
           box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
  .camhint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:13px;
           color:rgba(255,255,255,.85);text-shadow:0 1px 3px #000}
  .camerr{padding:22px 20px;text-align:center;color:var(--warn);font-size:13.5px;line-height:1.7}
  .camerr b{color:#fff}

  .result{padding:18px 16px;text-align:center;min-height:168px;display:flex;
          flex-direction:column;justify-content:center;gap:4px}
  .result .ic{font-size:44px;line-height:1}
  .result .msg{font-size:23px;font-weight:800;margin-top:6px;white-space:pre-line}
  .result .nm{font-size:18px;font-weight:700;margin-top:10px}
  .result .sub{font-size:14px;color:#9aa7b8;white-space:pre-line}
  .result.ok .msg{color:var(--ok)}
  .result.warn .msg{color:var(--warn)}
  .result.err .msg{color:var(--err)}
  .chips{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .chip{background:#1a2434;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13.5px}
  .chip b{color:#fff;font-size:17px}

  .bar{margin-top:auto;padding:14px 16px 22px;border-top:1px solid var(--line);background:#0b111b}
  .row{display:flex;gap:8px}
  input[type=text]{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);
                   background:#151d2b;color:#fff;font-size:15px;font-family:inherit;outline:none}
  input::placeholder{color:#5d6a7d}
  button{border:0;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer;font-size:15px}
  .b1{background:var(--accent);color:#fff;padding:13px 18px}
  .bshoot{background:#1a2434;color:#dce6f2;padding:14px;width:100%;margin-top:9px;
          border:1px solid var(--line);font-size:15.5px}
  .bshoot.primary{background:linear-gradient(160deg,#1f7ae0,#1559ab);color:#fff;border:0;
                  padding:18px;font-size:17px}
  .b2{background:none;color:#5d6a7d;padding:10px;width:100%;margin-top:4px;
      border:0;font-size:12.5px;text-decoration:underline}
  .note{font-size:12px;color:#7c899b;margin-top:8px;line-height:1.55;text-align:center}
  .hide{display:none !important}

  .setup{padding:40px 22px;text-align:center}
  .setup h2{font-size:20px;margin:0 0 8px}
  .setup p{font-size:14px;color:#9aa7b8;line-height:1.65;margin:0 0 20px}
  .setup input{width:100%;margin-bottom:10px;text-align:center}
  .setup .b1{width:100%;padding:15px}
  .setup .err{color:var(--err);font-size:13.5px;margin-top:12px;font-weight:700}
</style>
</head>
<body>

<div class="wrap">

  <!-- 주소·접속키가 비어 있을 때만 나오는 예비 화면 -->
  <div class="setup hide" id="setup">
    <div style="font-size:44px">★</div>
    <h2>현장 접수 스캐너</h2>
    <p>담당자에게 받은 두 값을 넣어주세요.<br>이 기기에 저장되어 다시 묻지 않습니다.</p>
    <input type="text" id="s_url" placeholder="웹앱 주소 (…/exec)" autocomplete="off" autocapitalize="off" spellcheck="false">
    <input type="text" id="s_key" placeholder="직원 접속키" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="b1" onclick="saveSetup()">저장하고 시작</button>
    <div class="err hide" id="s_err"></div>
  </div>

  <!-- 스캐너 -->
  <div id="main" class="hide" style="flex-direction:column;flex:1">
    <div class="top">
      <span class="dot" id="dot"></span>
      <span class="t">현장 접수 스캐너</span>
      <span class="c" id="cnt">확인 0명</span>
    </div>

    <div class="camwrap" id="camwrap">
      <video id="v" playsinline muted autoplay></video>
      <canvas id="cv"></canvas>
      <div class="frame"><i></i></div>
      <div class="camhint">참가자의 카카오톡 QR을 화면 안에 맞춰주세요</div>
    </div>
    <div class="camerr hide" id="camerr"></div>

    <div class="result" id="res">
      <div class="ic">▣</div>
      <div class="msg" style="font-size:18px;color:#9aa7b8">카메라를 켜는 중...</div>
    </div>

    <div class="bar">
      <div class="row">
        <input type="text" id="manual" placeholder="접수번호 · 이름 · 연락처로 접수" autocomplete="off">
        <button class="b1" onclick="manualCheck()">확인</button>
      </div>

      <button class="bshoot" id="shootBtn" onclick="document.getElementById('fileCam').click()">
        ▣ 사진 찍어서 접수
      </button>
      <input type="file" id="fileCam" accept="image/*" capture="environment" class="hide" onchange="onScanFile(this)">

      <button class="b2" id="retryBtn" onclick="restartLive()">카메라 다시 시작</button>

      <div class="note">
        QR이 안 찍히면 <b>접수번호(R00002)·이름·연락처</b>로도 접수됩니다.<br>
        명단에 없으면 노트북 담당 직원에게 안내하세요.
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
/* ═════════ 설정 읽기 ═════════ */
var CFG = { url: '', key: '' };

function loadCfg(){
  CFG.url = WEBAPP_URL || '';
  CFG.key = STAFF_KEY  || '';

  if (!CFG.url || !CFG.key){                       // 파일에 안 넣었으면 저장값 사용
    try {
      CFG.url = CFG.url || localStorage.getItem('swc_url') || '';
      CFG.key = CFG.key || localStorage.getItem('swc_key') || '';
    } catch(e){}
  }
  var q = new URLSearchParams(location.search);    // 주소로도 전달 가능
  if (q.get('u')) CFG.url = q.get('u');
  if (q.get('k')) CFG.key = q.get('k');

  CFG.url = (CFG.url || '').split('?')[0].trim();
  CFG.key = (CFG.key || '').trim();
  return CFG.url && CFG.key;
}

function saveSetup(){
  var u = document.getElementById('s_url').value.trim();
  var k = document.getElementById('s_key').value.trim();
  var e = document.getElementById('s_err');
  if (u.indexOf('/exec') < 0){
    e.textContent = '웹앱 주소는 /exec 로 끝나야 합니다.'; e.classList.remove('hide'); return;
  }
  if (!k){ e.textContent = '접속키를 넣어주세요.'; e.classList.remove('hide'); return; }
  CFG.url = u.split('?')[0]; CFG.key = k;
  try { localStorage.setItem('swc_url', CFG.url); localStorage.setItem('swc_key', k); } catch(err){}
  document.getElementById('setup').classList.add('hide');
  boot();
}

/* ═════════ 서버 호출 (JSONP — CORS 문제 없음) ═════════ */
var jsonpSeq = 0;
function callApi(params, onDone, onFail){
  var name = '__swc_cb_' + (++jsonpSeq);
  var done = false;
  var s = document.createElement('script');

  window[name] = function(data){
    done = true;
    try { onDone && onDone(data); } finally {
      try { delete window[name]; } catch(e){ window[name] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    }
  };

  var q = ['cb=' + name, 'k=' + encodeURIComponent(CFG.key), '_=' + Date.now()];
  Object.keys(params).forEach(function(p){ q.push(p + '=' + encodeURIComponent(params[p])); });

  s.src = CFG.url + '?p=api&' + q.join('&');
  s.onerror = function(){ if (!done){ done = true; onFail && onFail('연결 실패'); } };
  setTimeout(function(){ if (!done){ done = true; onFail && onFail('응답 시간 초과'); } }, 15000);
  document.body.appendChild(s);
}

/* ═════════ 접수 처리 ═════════ */
var count = 0, busy = false, lastCode = '', lastAt = 0;

function handle(raw){
  var now = Date.now();
  if (raw === lastCode && now - lastAt < 3500) return;
  lastCode = raw; lastAt = now;
  busy = true;
  beep(880, .07);
  show('', '⏳', '확인 중...', null, null, '명단을 대조하고 있습니다.');

  callApi({ a:'checkin', t: raw }, function(r){
    render(r);
    busy = false;
    // 참석 처리가 끝나면 알림톡을 곧바로 따로 요청합니다.
    // 화면은 기다리지 않으므로 바로 다음 사람을 찍을 수 있습니다.
    if (r && r.ok && r.needTalk){
      var tk = (r.person && r.person.토큰) ? r.person.토큰 : raw;
      callApi({ a:'talk', t: tk }, function(){}, function(){});
    }
  }, function(msg){
    show('err','⚠','통신 오류', null, null, msg + '\n인터넷 연결을 확인하고 다시 시도하세요.');
    busy = false;
  });
}

function manualCheck(){
  var el = document.getElementById('manual');
  var t = el.value.trim();
  if (!t) return;
  el.value = ''; el.blur(); lastCode = '';
  handle(t);
}

function render(r){
  if (r.ok){
    count++;
    document.getElementById('cnt').textContent = '확인 ' + count + '명';
    beep(1320,.12); setTimeout(function(){ beep(1760,.14); }, 130);
    vibe([40,60,40]);
    show('ok','✓','참석이 완료되었습니다', r.person, chips(r.person));
  } else if (r.code === 'ALREADY'){
    beep(440,.3); vibe([120,80,120]);
    show('warn','⚠','이미 참석확인된 QR입니다', r.person, chips(r.person));
  } else if (r.code === 'NOT_FOUND'){
    beep(220,.45); vibe([200,100,200]);
    show('err','✕','확인 불가', null, null,
         '사전신청 명단에서 찾을 수 없습니다.\n노트북 담당 직원에게 안내하세요.');
  } else if (r.code === 'AUTH'){
    show('err','⚠','접속키가 맞지 않습니다', null, null, '담당자에게 문의하세요.');
  } else {
    beep(220,.3);
    show('err','✕', r.msg || '확인 불가', null, null, '');
  }
}

function chips(p){
  if (!p) return '';
  return '<div class="chips">' +
    '<span class="chip">좌석 <b>' + (p.좌석배치||'-') + '</b>구역</span>' +
    '<span class="chip">응모권 <b>' + (p.응모권||'-') + '</b>번</span>' +
    '<span class="chip">' + (p.소속지회||'') + '지회</span></div>';
}

function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function show(cls, ic, msg, person, chipHtml, sub){
  var el = document.getElementById('res');
  el.className = 'result ' + (cls||'');
  var h = '<div class="ic">' + ic + '</div><div class="msg">' + esc(msg) + '</div>';
  if (person) h += '<div class="nm">' + esc(person.이름) + ' 선생님</div>' +
                   '<div class="sub">' + esc(person.기관명||'') + '</div>';
  if (sub)      h += '<div class="sub" style="margin-top:8px">' + esc(sub) + '</div>';
  if (chipHtml) h += chipHtml;
  el.innerHTML = h;
}

/* ═════════ 사진 촬영 판독 (어떤 기기에서도 됩니다) ═════════ */
function onScanFile(input){
  var file = input.files[0];
  if (!file) return;
  busy = true;
  show('', '⏳', '사진 분석 중...', null, null, 'QR 코드를 판독하고 있습니다.');

  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement('canvas');
      var c = canvas.getContext('2d');
      var maxDim = 1200, w = img.width, h = img.height;
      if (w > maxDim || h > maxDim){
        if (w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else      { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      canvas.width = w; canvas.height = h;
      c.drawImage(img, 0, 0, w, h);
      var d = c.getImageData(0, 0, w, h);

      var code = (typeof jsQR === 'function')
        ? jsQR(d.data, d.width, d.height, { inversionAttempts:'dontInvert' }) : null;
      if (!code || !code.data){
        code = (typeof jsQR === 'function')
          ? jsQR(d.data, d.width, d.height, { inversionAttempts:'attemptBoth' }) : null;
      }
      busy = false;

      if (code && code.data) handle(code.data);
      else {
        beep(220,.3);
        show('err','✕','QR 인식 실패', null, null,
             'QR이 선명하게 나오도록 조금 더 가까이서 다시 찍어주세요.\n' +
             '참가자에게 화면 밝기를 최대로 올려달라고 하세요.');
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

/* ═════════ 실시간 카메라 (열자마자 자동 시작) ═════════ */
var stream = null, raf = null, live = false, v, cv, ctx;

function startLive(){
  v   = document.getElementById('v');
  cv  = document.getElementById('cv');
  ctx = cv.getContext('2d', { willReadFrequently: true });

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return camFail('이 브라우저는 실시간 카메라를 지원하지 않습니다');
  }
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal:'environment' }, width:{ideal:1280}, height:{ideal:1280} },
    audio: false
  }).then(function(s){
    stream = s; v.srcObject = s; v.setAttribute('playsinline','');
    return v.play();
  }).then(function(){
    live = true;
    document.getElementById('dot').classList.add('on');
    document.getElementById('camwrap').classList.remove('hide');
    document.getElementById('camerr').classList.add('hide');
    document.getElementById('shootBtn').classList.remove('primary');
    document.getElementById('retryBtn').classList.add('hide');
    show('', '▣', '대기 중', null, null, 'QR을 화면 안에 맞춰주세요');
    loop();
  }).catch(function(e){ camFail(e && e.name ? e.name : String(e)); });
}

function restartLive(){
  if (raf) cancelAnimationFrame(raf);
  if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
  stream = null; live = false;
  document.getElementById('dot').classList.remove('on');
  setTimeout(startLive, 300);
}

function camFail(reason){
  live = false;
  document.getElementById('dot').classList.remove('on');
  document.getElementById('camwrap').classList.add('hide');
  document.getElementById('retryBtn').classList.remove('hide');
  document.getElementById('shootBtn').classList.add('primary');   // 사진 방식을 크게

  var el = document.getElementById('camerr');
  el.classList.remove('hide');
  el.innerHTML = '⚠ 실시간 카메라를 열 수 없습니다 (' + esc(reason) + ')<br>' +
    '카카오톡 안에서 열면 막힙니다. <b>사파리·크롬</b>으로 열어주세요.<br><br>' +
    '<b>아래 [사진 찍어서 접수] 로는 그대로 접수할 수 있습니다.</b>';
  show('', '▣', '사진으로 접수하세요', null, null, '아래 파란 버튼을 누르면 카메라가 열립니다');
}

function loop(){
  if (!live) return;
  raf = requestAnimationFrame(loop);
  if (busy || v.readyState !== v.HAVE_ENOUGH_DATA) return;
  var w = v.videoWidth, h = v.videoHeight;
  if (!w || !h) return;
  var size = Math.min(w, h);
  cv.width = 500; cv.height = 500;
  ctx.drawImage(v, (w-size)/2, (h-size)/2, size, size, 0, 0, 500, 500);
  var d = ctx.getImageData(0, 0, 500, 500);
  var code = (typeof jsQR === 'function')
    ? jsQR(d.data, d.width, d.height, { inversionAttempts:'dontInvert' }) : null;
  if (code && code.data) handle(code.data);
}

/* ═════════ 소리 · 진동 ═════════ */
var actx = null;
function beep(freq, dur){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(.001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.28, actx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + .02);
  }catch(e){}
}
function vibe(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

document.addEventListener('click', function once(){
  try{ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){}
  document.removeEventListener('click', once);
});

/* ═════════ 시작 ═════════ */
function boot(){
  var m = document.getElementById('main');
  m.classList.remove('hide');
  m.style.display = 'flex';
  document.getElementById('manual')
    .addEventListener('keydown', function(e){ if (e.key === 'Enter') manualCheck(); });
  startLive();                       // 열자마자 카메라 켜기
}

if (loadCfg()) {
  boot();
} else {
  document.getElementById('setup').classList.remove('hide');
}
</script>
</body>
</html>
