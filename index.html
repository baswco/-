<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2026 사대회 현장 접수 스캐너</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    :root {
      --navy: #0f2f5c; --navy2: #1a4b8c; --accent: #1f7ae0;
      --ok: #0f9d58; --ok-bg: #e6f4ea; --ok-border: #34a853;
      --warn: #f29900; --warn-bg: #fef7e0;
      --err: #d93025; --err-bg: #fce8e6;
      --bg: #f4f6fa; --card: #ffffff; --line: #e3e8ef; --ink: #16202e; --sub: #6b7684;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      font-size: 15px; line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }
    .wrap {
      max-width: 480px; margin: 0 auto; min-height: 100vh;
      display: flex; flex-direction: column; padding-bottom: 24px;
    }

    /* 상단 헤더 */
    .top {
      padding: 14px 18px; display: flex; align-items: center; gap: 10px;
      background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #8ba0bd; }
    .dot.on { background: #3ddc84; box-shadow: 0 0 0 4px rgba(61, 220, 132, 0.3); }
    .dot.paused { background: #f29900; box-shadow: 0 0 0 4px rgba(242, 153, 0, 0.3); }
    .top .t { font-weight: 800; font-size: 16px; letter-spacing: -0.3px; }
    .top .c { margin-left: auto; font-size: 14px; font-weight: 800; color: #b8d4f8; }

    .main-body { padding: 12px; display: flex; flex-direction: column; gap: 12px; }

    /* 📸 카메라 뷰파인더 */
    .camwrap {
      position: relative; background: #e9eef6; border-radius: 14px;
      width: 100%; height: 280px; overflow: hidden; border: 2px solid var(--line);
      display: flex; align-items: center; justify-content: center;
    }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    canvas { display: none; }
    
    .frame {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
    }
    .frame i {
      width: 65%; aspect-ratio: 1/1; border: 3px solid #1f7ae0; border-radius: 18px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.35);
    }
    .camhint {
      position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
      font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000;
    }

    /* 카메라 미연결 시 안내 카드 */
    .cam-fallback {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center; gap: 10px; z-index: 5;
    }
    .cam-fallback .ic { font-size: 40px; }
    .cam-fallback .t1 { font-size: 16px; font-weight: 800; color: var(--navy); }
    .cam-fallback .t2 { font-size: 13px; color: var(--sub); line-height: 1.4; }

    .cam-overlay {
      position: absolute; inset: 0; background: rgba(15, 47, 92, 0.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 800; font-size: 17px; color: #3ddc84; z-index: 10; gap: 6px;
    }

    /* 🌟 슬림 결과창 */
    .result {
      position: relative;
      padding: 16px 14px; text-align: center; min-height: 90px; display: flex;
      flex-direction: column; justify-content: center; background: #fff;
      border: 2px solid var(--line); border-radius: 14px;
      transition: all 0.25s ease-out; overflow: hidden;
      box-shadow: 0 2px 8px rgba(16, 32, 56, 0.05);
    }
    .result.pop { animation: pop 0.3s ease-out; }
    @keyframes pop { 0% { transform: scale(0.97); } 50% { transform: scale(1.01); } 100% { transform: scale(1); } }

    .result .idle-row { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--sub); font-weight: 700; }
    .result .idle-row .ic { font-size: 24px; }
    .result .idle-row .msg { font-size: 15.5px; color: var(--ink); }

    .result .msg { font-size: 21px; font-weight: 900; letter-spacing: -0.3px; }
    .result .nm { font-size: 19px; font-weight: 900; margin-top: 4px; color: var(--navy); }

    .result.ok { border-color: var(--ok-border); background: var(--ok-bg); }
    .result.ok .msg { color: #0b8043; }
    .result.warn { border-color: var(--warn); background: var(--warn-bg); }
    .result.warn .msg { color: #b06000; }
    .result.err { border-color: var(--err); background: var(--err-bg); }
    .result.err .msg { color: #c5221f; }

    /* 🎟 응모권 번호 대형 뱃지 (좌석배치는 완전 삭제) */
    .ticket-badge-box {
      margin-top: 8px; padding: 10px 14px; border-radius: 10px;
      background: #fff; border: 2px solid var(--ok);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .ticket-label { font-size: 13.5px; color: var(--sub); font-weight: 700; }
    .ticket-val { font-size: 26px; font-weight: 900; color: #0b8043; line-height: 1; }

    .time-stamp { font-size: 12px; color: var(--sub); margin-top: 6px; }

    .timer-bar {
      position: absolute; bottom: 0; left: 0; height: 4px; background: var(--ok);
      width: 100%; transform-origin: left;
    }
    .timer-bar.running { animation: timer 6s linear forwards; }
    @keyframes timer { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    .btn-next {
      background: var(--navy); color: #fff; border: 0;
      border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 800; margin-top: 8px; cursor: pointer;
    }

    /* 수동 입력 및 하단 조작부 */
    .control-box {
      background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px;
      box-shadow: 0 2px 8px rgba(16, 32, 56, 0.05);
    }
    .row { display: flex; gap: 8px; }
    input[type=text] {
      flex: 1; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
      background: #f8fafc; color: var(--ink); font-size: 15px; outline: none; font-family: inherit;
    }
    input[type=text]:focus { border-color: var(--accent); background: #fff; }
    
    button {
      border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-submit { background: var(--navy); color: #fff; padding: 12px 18px; font-size: 15px; }
    
    .btn-camera {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px; margin-top: 10px; background: var(--ok); color: #fff;
      border-radius: 10px; font-size: 16px; font-weight: 800;
      box-shadow: 0 4px 12px rgba(15, 157, 88, 0.25);
    }
    .btn-restart {
      background: #f1f3f7; color: var(--sub); border: 1px solid var(--line);
      padding: 10px; width: 100%; margin-top: 10px; font-size: 13px;
    }
    .note { font-size: 12px; color: var(--sub); margin-top: 10px; line-height: 1.5; text-align: center; }
    .hide { display: none !important; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="top">
      <span class="dot" id="dot"></span>
      <span class="t">2026 사대회 현장 접수</span>
      <span class="c" id="cnt">접수 0명</span>
    </div>

    <div class="main-body">
      <!-- 📸 카메라 뷰파인더 -->
      <div class="camwrap" id="camwrap">
        <video id="v" autoplay playsinline muted webkit-playsinline></video>
        <canvas id="cv"></canvas>
        <div class="frame" id="camFrame"><i></i></div>
        <div class="camhint" id="camHint">QR 코드를 비추면 즉시 자동 처리됩니다</div>

        <!-- 카메라 미연결 시 버튼 안내창 -->
        <div class="cam-fallback hide" id="camFallback">
          <div class="ic">📷</div>
          <div class="t1">실시간 카메라 시작하기</div>
          <div class="t2">아래 버튼을 눌러 카메라 권한을 허용해 주세요.</div>
          <button class="btn-submit" onclick="userStartCamera()">📷 카메라 켜기</button>
        </div>

        <div class="cam-overlay hide" id="camOverlay">
          <span>✅ 참석 확인 완료</span>
          <small style="font-size:12px;opacity:0.85">(6초 유지 중...)</small>
        </div>
      </div>

      <!-- 🌟 슬림 결과창 -->
      <div class="result" id="res">
        <div class="idle-row">
          <span class="ic">📷</span>
          <span class="msg">스캔 대기 중 (QR을 비춰주세요)</span>
        </div>
        <div class="timer-bar hide" id="timerBar"></div>
      </div>

      <!-- 수동 번호 입력 및 버튼 영역 -->
      <div class="control-box">
        <div class="row">
          <input type="text" id="manual" placeholder="접수번호(R00002) 또는 이름 입력" autocomplete="off">
          <button class="btn-submit" onclick="manualCheck()">확인</button>
        </div>

        <input type="file" id="fileCam" accept="image/*" capture="environment" class="hide" onchange="onScanFile(this)">
        <button class="btn-camera" onclick="document.getElementById('fileCam').click()">
          📸 사진 촬영으로 QR 인식
        </button>

        <button class="btn-restart" onclick="userStartCamera()">🔄 카메라 다시 시작</button>

        <div class="note">
          · 접수번호(<b>R00002</b>), <b>이름</b>, <b>연락처</b>로도 검색 및 출석이 가능합니다.<br>
          · 실시간 화면이 안 나올 땐 <b>[사진 촬영으로 QR 인식]</b>을 이용하세요.
        </div>
      </div>
    </div>
  </div>

  <script>
    var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbztTWFK3i3F3sjXkeZujNA53ZSnZet_QKWyGIi9cwhVcrFrgPW1gu4FsklnXtqceQdl/exec';
    var STAFF_KEY   = 'swc2026';

    var count = 0, isProcessing = false, isPaused = false, lockTimer = null, lastScannedValue = '';
    var v  = document.getElementById('v');
    var cv = document.getElementById('cv');
    var ctx= cv.getContext('2d', { willReadFrequently: true });
    var fallbackEl = document.getElementById('camFallback');

    function userStartCamera(){
      fallbackEl.classList.add('hide');
      startCamera();
    }

    function startCamera(){
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showFallback();
        return;
      }
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      }).then(handleStreamSuccess)
      .catch(function(){
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then(handleStreamSuccess)
          .catch(function(err){
            console.log('Camera error:', err);
            showFallback();
          });
      });
    }

    function handleStreamSuccess(s){
      v.srcObject = s;
      v.setAttribute('playsinline', '');
      v.setAttribute('autoplay', '');
      v.setAttribute('muted', '');
      v.onloadedmetadata = function(){
        v.play().then(function(){
          fallbackEl.classList.add('hide');
          document.getElementById('dot').className = 'dot on';
          loop();
        }).catch(function(){
          showFallback();
        });
      };
    }

    function showFallback(){
      fallbackEl.classList.remove('hide');
      document.getElementById('dot').className = 'dot';
    }

    function loop(){
      requestAnimationFrame(loop);
      if (isPaused || isProcessing || v.readyState !== v.HAVE_ENOUGH_DATA) return;
      var w = v.videoWidth, h = v.videoHeight;
      if (!w || !h) return;
      var size = Math.min(w, h);
      cv.width = 500; cv.height = 500;
      ctx.drawImage(v, (w - size)/2, (h - size)/2, size, size, 0, 0, 500, 500);
      var img = ctx.getImageData(0, 0, 500, 500);
      var code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      if (code && code.data) {
        var scanned = String(code.data).trim();
        if (scanned === lastScannedValue) return;
        handleScan(scanned);
      }
    }

    function onScanFile(input) {
      var file = input.files[0];
      if (!file) return;
      isProcessing = true;
      showIdle('⏳ 사진 분석 중...');

      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var c = canvas.getContext('2d');
          var maxDim = 1200, w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          canvas.width = w; canvas.height = h;
          c.drawImage(img, 0, 0, w, h);
          var imgData = c.getImageData(0, 0, w, h);
          var code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'dontInvert' }) ||
                     jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });

          isProcessing = false;
          if (code && code.data) {
            handleScan(String(code.data).trim());
          } else {
            soundErr();
            showResult('err pop', '❌ QR 인식 실패', null, 'QR 코드가 선명하게 나오도록 다시 촬영해 주세요.');
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

    function handleScan(raw){
      if (isPaused || isProcessing) return;
      isPaused = true; isProcessing = true; lastScannedValue = raw;

      playBeep(880, 0.06);
      showIdle('⏳ 출석 처리 중...');

      fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ a: 'checkin', t: raw, k: STAFF_KEY })
      })
      .then(function(res){ return res.json(); })
      .then(function(r){
        isProcessing = false;
        render(r);
      })
      .catch(function(err){
        isProcessing = false; isPaused = false;
        showResult('err', '⚠ 통신 오류', null, '인터넷 연결을 확인하고 다시 시도해 주세요.');
      });
    }

    function manualCheck(){
      var el = document.getElementById('manual');
      var t = el.value.trim();
      if (!t) return;
      el.value = ''; lastScannedValue = '';
      handleScan(t);
    }
    document.getElementById('manual').addEventListener('keydown', function(e){
      if (e.key === 'Enter') manualCheck();
    });

    /* ── 🌟 출석 완료 화면 렌더링 (응모권 번호만 강조) ── */
    function render(r){
      var el = document.getElementById('res');
      el.classList.remove('pop');
      void el.offsetWidth;
      document.getElementById('dot').className = 'dot paused';

      if (r.ok){
        count++;
        document.getElementById('cnt').textContent = '접수 ' + count + '명';
        soundSuccess(); vibe([50, 60, 50]);
        
        var p = r.person || {};
        var ticketHtml = 
          '<div class="ticket-badge-box">' +
            '<span class="ticket-label">🎟 경품 응모권 번호</span>' +
            '<span class="ticket-val">' + (p.응모권 || '-') + '번</span>' +
          '</div>' +
          '<div class="time-stamp">⏱ 접수: ' + (p.참석일시 || '') + '</div>' +
          '<button class="btn-next" onclick="unlockScan()">⏩ 다음 스캔 바로하기</button>';

        showResult('ok pop', '✅ 참석 확인 완료', p, ticketHtml);
        lockCameraForSeconds(6);

      } else if (r.code === 'ALREADY'){
        soundWarn(); vibe([120, 80, 120]);
        var p = r.person || {};
        var ticketHtml = 
          '<div class="ticket-badge-box" style="border-color:var(--warn);background:#fff">' +
            '<span class="ticket-label">🎟 응모권 번호</span>' +
            '<span class="ticket-val" style="color:#b06000">' + (p.응모권 || '-') + '번</span>' +
          '</div>' +
          '<div class="time-stamp" style="color:#b06000">⚠ 기존 접수시간: ' + (p.참석일시 || '') + '</div>' +
          '<button class="btn-next" onclick="unlockScan()">⏩ 다음 스캔 바로하기</button>';

        showResult('warn pop', '⚠ 이미 출석된 QR', p, ticketHtml);
        lockCameraForSeconds(5);

      } else if (r.code === 'NOT_FOUND'){
        soundErr(); vibe([200, 100, 200]);
        showResult('err pop', '❌ 사전신청 명단 없음', null, '사전신청 명단에서 확인되지 않습니다.\n현장 접수대(안내데스크)에 문의해 주세요.');
        lockCameraForSeconds(5);
      } else {
        soundErr();
        showResult('err pop', '❌ ' + (r.msg || '확인 불가'), null, '');
        lockCameraForSeconds(4);
      }
    }

    function showIdle(text){
      var el = document.getElementById('res');
      el.className = 'result';
      el.innerHTML = '<div class="idle-row"><span class="ic">📷</span><span class="msg">' + text + '</span></div>';
    }

    function showResult(cls, titleMsg, person, contentHtml){
      var el = document.getElementById('res');
      el.className = 'result ' + (cls || '');
      var h = '<div class="msg">' + titleMsg + '</div>';
      if (person) {
        h += '<div class="nm">' + person.이름 + ' 선생님 <small style="font-size:13px;font-weight:400;color:var(--sub)">(' + (person.소속지회||'') + '지회 · ' + (person.기관명||'') + ')</small></div>';
      }
      if (contentHtml) h += contentHtml;
      h += '<div class="timer-bar hide" id="timerBar"></div>';
      el.innerHTML = h;
    }

    function lockCameraForSeconds(sec){
      isPaused = true;
      document.getElementById('camOverlay').classList.remove('hide');

      var bar = document.getElementById('timerBar');
      if (bar) {
        bar.classList.remove('hide');
        bar.style.animation = 'none';
        void bar.offsetWidth;
        bar.style.animation = 'timer ' + sec + 's linear forwards';
      }

      if (lockTimer) clearTimeout(lockTimer);
      lockTimer = setTimeout(unlockScan, sec * 1000);
    }

    function unlockScan(){
      if (lockTimer) clearTimeout(lockTimer);
      isPaused = false; isProcessing = false; lastScannedValue = '';
      document.getElementById('camOverlay').classList.add('hide');
      document.getElementById('dot').className = 'dot on';
      showIdle('스캔 대기 중 (QR을 비춰주세요)');
    }

    var actx = null;
    function getAudio(){
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }
    function playBeep(freq, dur){
      try {
        var ctx = getAudio();
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(0.001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + dur + 0.02);
      } catch(e){}
    }
    function soundSuccess(){
      playBeep(880, 0.08); setTimeout(function(){ playBeep(1320, 0.1); }, 90); setTimeout(function(){ playBeep(1760, 0.14); }, 190);
    }
    function soundWarn(){ playBeep(554, 0.12); setTimeout(function(){ playBeep(440, 0.2); }, 130); }
    function soundErr(){ playBeep(220, 0.3); }
    function vibe(pattern){ try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e){} }

    document.addEventListener('click', function once(){ getAudio(); document.removeEventListener('click', once); });

    startCamera();
  </script>
</body>
</html>
