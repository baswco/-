<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2026 사대회 현장 접수 스캐너</title>
  <style>
    :root {
      --navy: #0f2f5c; --accent: #1f7ae0;
      --ok: #0f9d58; --ok-bg: #0d281e; --ok-border: #2bb471;
      --warn: #f29900; --warn-bg: #291e0a;
      --err: #d93025; --err-bg: #291012;
      --bg: #0d1420; --card: #151d2b; --line: #2b3646; --sub: #8b97a8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background: var(--bg); color: #fff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px; line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }
    .wrap {
      max-width: 480px; margin: 0 auto; min-height: 100vh;
      display: flex; flex-direction: column; padding-bottom: 30px;
    }

    /* 상단 헤더 */
    .top {
      padding: 14px 18px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--line); background: #0b111b; position: sticky; top: 0; z-index: 100;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #4b5666; }
    .dot.on { background: #3ddc84; box-shadow: 0 0 0 4px rgba(61, 220, 132, 0.25); }
    .dot.paused { background: #f29900; box-shadow: 0 0 0 4px rgba(242, 153, 0, 0.25); }
    .top .t { font-weight: 800; font-size: 16px; }
    .top .c { margin-left: auto; font-size: 14px; font-weight: 800; color: #3ddc84; }

    .main-body { padding: 12px; display: flex; flex-direction: column; gap: 12px; }

    /* 카메라 뷰파인더 */
    .camwrap {
      position: relative; background: #000; border-radius: 14px;
      aspect-ratio: 4 / 3; max-height: 230px; overflow: hidden; border: 1.5px solid var(--line);
    }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    canvas { display: none; }
    .frame {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
    }
    .frame i {
      width: 58%; aspect-ratio: 1/1; border: 3px solid rgba(255, 255, 255, 0.9); border-radius: 16px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.4);
    }
    .camhint {
      position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
      font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000;
    }
    .cam-overlay {
      position: absolute; inset: 0; background: rgba(13, 20, 32, 0.85);
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px;
      color: #3ddc84; z-index: 5;
    }

    /* 🌟 결과 표시 카드 (초록색 완료 창) */
    .result {
      position: relative;
      padding: 22px 16px; text-align: center; min-height: 210px; display: flex;
      flex-direction: column; justify-content: center; background: var(--card);
      border: 2.5px solid var(--line); border-radius: 16px;
      transition: all 0.25s ease-out; overflow: hidden;
    }
    .result.pop { animation: pop 0.35s ease-out; }
    @keyframes pop {
      0% { transform: scale(0.95); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .result .ic { font-size: 44px; line-height: 1; margin-bottom: 6px; }
    .result .msg { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; }
    .result .nm { font-size: 23px; font-weight: 900; margin-top: 8px; color: #fff; }
    .result .sub { font-size: 14.5px; color: var(--sub); margin-top: 3px; }

    /* 성공(완료) 스타일 */
    .result.ok {
      border-color: var(--ok-border); background: var(--ok-bg);
      box-shadow: 0 0 30px rgba(15, 157, 88, 0.45);
    }
    .result.ok .msg { color: #3ddc84; }
    
    /* 중복/경고 스타일 */
    .result.warn { border-color: var(--warn); background: var(--warn-bg); }
    .result.warn .msg { color: #ffc94d; }
    
    /* 실패 스타일 */
    .result.err { border-color: var(--err); background: var(--err-bg); }
    .result.err .msg { color: #ff6b5e; }

    /* 좌석 / 응모권 대형 뱃지 */
    .chips {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin-top: 14px; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,0.15);
    }
    .badge-box {
      background: rgba(255,255,255,0.06); border-radius: 12px; padding: 10px 8px; text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .badge-box.seat { border-color: rgba(77, 163, 255, 0.4); background: rgba(31, 122, 224, 0.15); }
    .badge-box.ticket { border-color: rgba(61, 220, 132, 0.4); background: rgba(15, 157, 88, 0.15); }
    
    .badge-label { font-size: 12px; color: #9aa7b8; font-weight: 600; }
    .badge-value { font-size: 24px; font-weight: 900; margin-top: 2px; line-height: 1.15; }
    .badge-box.seat .badge-value { color: #5eb2ff; }
    .badge-box.ticket .badge-value { color: #43e68c; }

    .time-stamp { font-size: 12px; color: #8b97a8; margin-top: 8px; }

    /* ⏳ 7초 타이머 게이지 바 */
    .timer-bar {
      position: absolute; bottom: 0; left: 0; height: 5px; background: #3ddc84;
      width: 100%; transform-origin: left;
    }
    .timer-bar.running { animation: timer 7s linear forwards; }
    @keyframes timer {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }

    /* 다음 사람 바로 스캔 버튼 */
    .btn-next {
      background: #1f7ae0; color: #fff; border: 0;
      border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 800; margin-top: 12px;
      cursor: pointer; box-shadow: 0 2px 8px rgba(31,122,224,0.4);
    }
    .btn-next:active { background: #1662b8; }

    /* 수동 입력 및 하단 조작부 */
    .control-box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .row { display: flex; gap: 8px; }
    input[type=text] {
      flex: 1; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--line);
      background: #0b111b; color: #fff; font-size: 15px; outline: none; font-family: inherit;
    }
    input[type=text]:focus { border-color: var(--accent); }
    
    button {
      border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-submit { background: var(--accent); color: #fff; padding: 13px 18px; font-size: 15px; }
    
    .btn-camera {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px; margin-top: 10px; background: var(--ok); color: #fff;
      border-radius: 10px; font-size: 16px; font-weight: 800;
    }
    .btn-camera:active { background: #0b8043; }

    .btn-restart {
      background: #1a2434; color: var(--sub); border: 1px solid var(--line);
      padding: 10px; width: 100%; margin-top: 10px; font-size: 13px;
    }

    .note { font-size: 12px; color: #7c899b; margin-top: 10px; line-height: 1.5; text-align: center; }
    .hide { display: none !important; }
  </style>
</head>
<body>

  <div class="wrap">
    <!-- 상단 헤더 -->
    <div class="top">
      <span class="dot" id="dot"></span>
      <span class="t">2026 사대회 현장 접수</span>
      <span class="c" id="cnt">접수 0명</span>
    </div>

    <div class="main-body">
      <!-- 실시간 카메라 뷰파인더 -->
      <div class="camwrap" id="camwrap">
        <video id="v" autoplay playsinline muted webkit-playsinline></video>
        <canvas id="cv"></canvas>
        <div class="frame"><i></i></div>
        <div class="camhint">QR 코드를 비추면 즉시 자동 처리됩니다</div>
        <div class="cam-overlay hide" id="camOverlay">✅ 완료되었습니다 (7초 대기 중)</div>
      </div>

      <!-- 🌟 결과 안내 카드 -->
      <div class="result" id="res">
        <div class="ic">📷</div>
        <div class="msg" style="font-size:18px;color:#9aa7b8">스캔 대기 중</div>
        <div class="sub">참가자 QR을 비추거나 아래에 번호를 입력하세요.</div>
        <div class="timer-bar hide" id="timerBar"></div>
      </div>

      <!-- 수동 번호 입력 및 버튼 영역 -->
      <div class="control-box">
        <div class="row">
          <input type="text" id="manual" placeholder="접수번호(예: R00002) 또는 이름 입력" autocomplete="off">
          <button class="btn-submit" onclick="manualCheck()">확인</button>
        </div>

        <input type="file" id="fileCam" accept="image/*" capture="environment" class="hide" onchange="onScanFile(this)">
        <button class="btn-camera" onclick="document.getElementById('fileCam').click()">
          📸 카메라로 QR 바로 찍기
        </button>

        <button class="btn-restart" onclick="restartCamera()">🔄 실시간 카메라 다시 켜기</button>

        <div class="note">
          · 접수번호(<b>R00002</b>), <b>이름</b>, <b>연락처</b>로도 검색 및 출석이 가능합니다.<br>
          · 실시간 인식이 안 될 땐 <b>[카메라로 QR 바로 찍기]</b>를 누르세요.
        </div>
      </div>
    </div>
  </div>

  <!-- QR 디코딩 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbztTWFK3i3F3sjXkeZujNA53ZSnZet_QKWyGIi9cwhVcrFrgPW1gu4FsklnXtqceQdl/exec';
    var STAFF_KEY   = 'swc2026';

    var count = 0;
    var isProcessing = false;   // 서버 통신 중 여부
    var isPaused = false;       // 🌟 7초간 카메라 완전 락(잠금) 여부
    var lockTimer = null;
    var lastScannedValue = '';

    var v  = document.getElementById('v');
    var cv = document.getElementById('cv');
    var ctx= cv.getContext('2d', { willReadFrequently: true });

    /* ── 1. 카메라 시작 ── */
    function startCamera(){
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      }).then(handleStreamSuccess)
      .catch(function(){
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then(handleStreamSuccess)
          .catch(function(err){
            console.log('카메라 열기 실패:', err);
            document.getElementById('dot').classList.remove('on');
          });
      });
    }

    function handleStreamSuccess(s){
      v.srcObject = s;
      v.setAttribute('playsinline', '');
      v.play().then(function(){
        document.getElementById('dot').className = 'dot on';
        loop();
      }).catch(function(){});
    }

    function restartCamera(){
      unlockScan();
      startCamera();
    }

    /* ── 2. 🌟 실시간 프레임 스캔 (잠금 상태일 땐 0% 스캔 차단) ── */
    function loop(){
      requestAnimationFrame(loop);
      
      // 🛑 잠금 상태이거나 처리 중일 땐 비디오 분석 자체를 아예 중단
      if (isPaused || isProcessing || v.readyState !== v.HAVE_ENOUGH_DATA) return;
      
      var w = v.videoWidth, h = v.videoHeight;
      if (!w || !h) return;
      var size = Math.min(w, h);
      cv.width = 500; cv.height = 500;
      ctx.drawImage(v, (w - size)/2, (h - size)/2, size, size, 0, 0, 500, 500);
      var img = ctx.getImageData(0, 0, 500, 500);
      var code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      
      if (code && code.data) {
        var scanned = String(code.data).trim();
        // 방금 처리한 사람과 같은 QR이면 잠금 중복 방지
        if (scanned === lastScannedValue) return;
        handleScan(scanned);
      }
    }

    /* ── 3. 사진 파일로 QR 디코딩 ── */
    function onScanFile(input) {
      var file = input.files[0];
      if (!file) return;
      isProcessing = true;
      show('', '⏳', '사진 분석 중...', null, null, 'QR 코드를 판독하고 있습니다.');

      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var c = canvas.getContext('2d');
          var maxDim = 1200;
          var w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          canvas.width = w; canvas.height = h;
          c.drawImage(img, 0, 0, w, h);

          var imgData = c.getImageData(0, 0, w, h);
          var code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'dontInvert' });
          if (!code || !code.data) {
            code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
          }

          isProcessing = false;
          if (code && code.data) {
            handleScan(String(code.data).trim());
          } else {
            soundErr();
            show('err', '❌', 'QR 인식 실패', null, null, 'QR 코드가 선명하게 나오도록 다시 촬영해 주세요.');
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

    /* ── 4. 🌟 서버로 출석 전송 및 즉시 카메라 잠금 ── */
    function handleScan(raw){
      if (isPaused || isProcessing) return;
      
      // 🔒 스캔되는 순간 즉시 카메라 스캔을 잠금
      isPaused = true;
      isProcessing = true;
      lastScannedValue = raw;

      playBeep(880, 0.06);
      show('', '⏳', '출석 처리 중...', null, null, '명단 대조 및 시트 기록 중');

      fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ a: 'checkin', t: raw, k: STAFF_KEY })
      })
      .then(function(res){ return res.json(); })
      .then(function(r){
        isProcessing = false;
        render(r);
      })
      .catch(function(err){
        isProcessing = false;
        isPaused = false; // 통신 오류 시엔 잠금 해제
        show('err', '⚠', '통신 오류', null, null, '인터넷 연결을 확인하고 다시 시도해 주세요.');
      });
    }

    function manualCheck(){
      var el = document.getElementById('manual');
      var t = el.value.trim();
      if (!t) return;
      el.value = '';
      lastScannedValue = '';
      handleScan(t);
    }
    document.getElementById('manual').addEventListener('keydown', function(e){
      if (e.key === 'Enter') manualCheck();
    });

    /* ── 5. 🌟 출석 완료 화면 렌더링 (7초 동안 절대 변경 없음) ── */
    function render(r){
      var el = document.getElementById('res');
      el.classList.remove('pop');
      void el.offsetWidth;

      // 상단 점 상태 주황색(잠금) 표시
      document.getElementById('dot').className = 'dot paused';

      if (r.ok){
        count++;
        document.getElementById('cnt').textContent = '접수 ' + count + '명';
        soundSuccess();
        vibe([50, 60, 50]);
        
        var p = r.person || {};
        var badges = 
          '<div class="chips">' +
            '<div class="badge-box seat"><div class="badge-label">좌석 구역</div><div class="badge-value">' + (p.좌석배치 || '-') + '구역</div></div>' +
            '<div class="badge-box ticket"><div class="badge-label">응모권 번호</div><div class="badge-value">' + (p.응모권 || '-') + '번</div></div>' +
          '</div>' +
          '<div class="time-stamp">⏱ 접수완료: ' + (p.참석일시 || '') + '</div>' +
          '<button class="btn-next" onclick="unlockScan()">⏩ 다음 참가자 바로 스캔</button>';

        show('ok pop', '✅', '참석 확인되었습니다', p, badges, '');
        lockCameraForSeconds(7); // 🌟 7초간 유지

      } else if (r.code === 'ALREADY'){
        soundWarn();
        vibe([120, 80, 120]);
        var p = r.person || {};
        var badges = 
          '<div class="chips">' +
            '<div class="badge-box seat"><div class="badge-label">좌석 구역</div><div class="badge-value">' + (p.좌석배치 || '-') + '구역</div></div>' +
            '<div class="badge-box ticket"><div class="badge-label">응모권 번호</div><div class="badge-value">' + (p.응모권 || '-') + '번</div></div>' +
          '</div>' +
          '<div class="time-stamp" style="color:#ffc94d">⚠ 기존 접수시간: ' + (p.참석일시 || '') + '</div>' +
          '<button class="btn-next" onclick="unlockScan()">⏩ 다음 참가자 바로 스캔</button>';

        show('warn pop', '⚠', '이미 출석 완료된 QR', p, badges, '');
        lockCameraForSeconds(5); // 5초간 유지

      } else if (r.code === 'NOT_FOUND'){
        soundErr();
        vibe([200, 100, 200]);
        show('err pop', '❌', '사전신청 명단 없음', null, null, '사전신청 명단에서 확인되지 않습니다.\n현장 접수대(안내데스크) 직원에게 문의해 주세요.');
        lockCameraForSeconds(5);
      } else {
        soundErr();
        show('err pop', '❌', r.msg || '확인 불가', null, null, '');
        lockCameraForSeconds(4);
      }
    }

    function show(cls, ic, msg, person, chipHtml, sub){
      var el = document.getElementById('res');
      el.className = 'result ' + (cls || '');
      var h = '<div class="ic">' + ic + '</div><div class="msg">' + msg + '</div>';
      if (person) {
        h += '<div class="nm">' + person.이름 + ' 선생님</div>' +
             '<div class="sub">' + (person.소속지회 || '') + '지회 · ' + (person.기관명 || '') + '</div>';
      }
      if (chipHtml) h += chipHtml;
      if (sub) h += '<div class="sub" style="white-space:pre-line;margin-top:8px">' + sub + '</div>';
      h += '<div class="timer-bar hide" id="timerBar"></div>';
      el.innerHTML = h;
    }

    /* ── 6. 🌟 7초 타이머 & 수동 즉시 해제 ── */
    function lockCameraForSeconds(sec){
      isPaused = true;
      document.getElementById('camOverlay').classList.remove('hide');
      document.getElementById('camOverlay').textContent = '✅ 출석 확인 완료 (' + sec + '초 유지)';

      var bar = document.getElementById('timerBar');
      if (bar) {
        bar.classList.remove('hide');
        bar.style.animation = 'none';
        void bar.offsetWidth;
        bar.style.animation = 'timer ' + sec + 's linear forwards';
      }

      if (lockTimer) clearTimeout(lockTimer);
      lockTimer = setTimeout(function(){
        unlockScan();
      }, sec * 1000);
    }

    function unlockScan(){
      if (lockTimer) clearTimeout(lockTimer);
      isPaused = false;
      isProcessing = false;
      lastScannedValue = ''; // 이전 사람 토큰 초기화
      document.getElementById('camOverlay').classList.add('hide');
      document.getElementById('dot').className = 'dot on';
      show('', '📷', '스캔 대기 중', null, null, '다음 참가자 QR을 비춰주세요.');
    }

    /* ── 7. 🎵 사운드 효과 ── */
    var actx = null;
    function getAudio(){
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }

    function playBeep(freq, dur){
      try {
        var ctx = getAudio();
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(0.001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + dur + 0.02);
      } catch(e){}
    }

    function soundSuccess(){
      playBeep(880, 0.1);
      setTimeout(function(){ playBeep(1320, 0.12); }, 110);
      setTimeout(function(){ playBeep(1760, 0.16); }, 230);
    }
    function soundWarn(){
      playBeep(554, 0.15);
      setTimeout(function(){ playBeep(440, 0.25); }, 160);
    }
    function soundErr(){ playBeep(220, 0.35); }

    function vibe(pattern){ try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e){} }

    document.addEventListener('click', function once(){
      getAudio();
      document.removeEventListener('click', once);
    });

    startCamera();
  </script>
</body>
</html>
